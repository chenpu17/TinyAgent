[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "tiny-agent"
version = "0.4.2"
description = "Python bindings for TinyAgent: a minimal, auditable AI agent"
license = { text = "MIT" }
requires-python = ">=3.8"

[project.urls]
Repository = "https://github.com/chenpu17/TinyAgent"

[tool.maturin]
# Flat module (tiny_agent.* ABI), not a package directory.
module-name = "tiny_agent"
