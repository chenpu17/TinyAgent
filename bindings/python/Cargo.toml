[package]
name = "tiny-agent-py"
version = "0.4.2"
edition = "2021"
description = "Python bindings for TinyAgent (import tiny_agent)"
license = "MIT"

[lib]
# The Python import name: `import tiny_agent`.
name = "tiny_agent"
crate-type = ["cdylib"]

[features]
default = []
# Forwarding feature for the run_code sandbox (design §8.6): off by default so
# standard wheels don't carry wasmtime (~10MB); building with it makes
# enable_code()/disable_code()/set_code_config() functional — without it they
# return a clear rebuild-hint error instead of silently no-op'ing.
code = ["ta_core/code"]

[dependencies]
# The core library. Aliased to `ta_core` (and locally `use ta_core as ta;`) so
# this crate's own lib name `tiny_agent` (the Python import) doesn't collide
# with the dependency it wraps.
ta_core = { package = "tiny-agent", path = "../..", features = ["mock"] }
pyo3 = { version = "0.22", features = ["extension-module", "py-clone"] }
pythonize = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
