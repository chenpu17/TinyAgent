[package]
name = "tiny-agent-node"
version = "0.4.1"
edition = "2021"
description = "Node.js / TypeScript bindings for TinyAgent (import 'tiny-agent')"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Forwarding feature for the run_code sandbox (design §8.6): off by default so
# the standard npm artifact doesn't carry wasmtime (~10MB); building with it
# makes enableCode()/disableCode()/setCodeConfig() functional — without it
# they return a clear rebuild-hint error instead of silently no-op'ing.
code = ["ta_core/code"]

[dependencies]
# The core library. Aliased (same reason as bindings/python): this crate's lib
# name — the npm package import — is `tiny-agent`, so the dependency it wraps
# needs a distinct dep key.
ta_core = { package = "tiny-agent", path = "../..", features = ["mock"] }
napi = { version = "2", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
napi-build = "2"
