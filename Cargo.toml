[package]
name = "tiny-agent"
version = "0.2.0"
edition = "2021"
description = "A minimal single-binary AI agent: one JSON config, two modes (headless / TUI)"

# Workspace so the language bindings (bindings/python, later bindings/node) are
# path-dependencies that evolve with the core library. The root package is a
# member too (it provides the `tiny_agent` lib + `tiny-agent` bin).
[workspace]
members = [".", "bindings/python"]
resolver = "2"

# bin + lib share this package: the binary (`tiny-agent`) keeps its existing
# behavior byte-for-byte; the library (`tiny_agent`) exposes the agent loop,
# tools, and providers for third-party / FFI use. Cargo auto-links the in-package
# lib to the bin, so main.rs does `use tiny_agent::...`.
[lib]
name = "tiny_agent"
path = "src/lib.rs"

[[bin]]
name = "tiny-agent"
path = "src/main.rs"

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-markdown", "dep:unicode-width"]
# Expose the scripted `provider::mock` (otherwise cfg(test)-only) so binding
# crates and downstream users can run offline / dry-run loops without a key.
mock = []

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ratatui = { version = "0.30", optional = true, features = ["scrolling-regions"] }
crossterm = { version = "0.28", optional = true }
tui-markdown = { version = "0.3", default-features = false, optional = true }
unicode-width = { version = "0.2", optional = true }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
