[package]
name = "tiny-agent"
version = "0.3.0"
edition = "2021"
# MSRV floor of the DEFAULT (headless) build, set by the dependency chain
# (clap 4.6 = 1.85; reqwest 1.64 / serde_json 1.71 / libc 1.65 sit below it).
# Optional features need more and are enforced by their own deps' rust-version:
# `tui` → 1.88 (ratatui 0.30), `code` → 1.86 (wasmtime 36). CI's msrv job
# pins this floor with a cargo +1.85 check.
rust-version = "1.85"
description = "A minimal single-binary AI agent: one JSON config, two modes (headless / TUI)"
license = "MIT"

# Workspace so the language bindings (bindings/python, bindings/node) are
# path-dependencies that evolve with the core library. The root package is a
# member too (it provides the `tiny_agent` lib + `tiny-agent` bin).
[workspace]
members = [".", "bindings/python", "bindings/node"]
resolver = "2"

# bin + lib share this package: the binary (`tiny-agent`) keeps its existing
# behavior byte-for-byte; the library (`tiny_agent`) exposes the agent loop,
# tools, and providers for third-party / FFI use. Cargo auto-links the in-package
# lib to the bin, so main.rs does `use tiny_agent::...`.
[lib]
name = "tiny_agent"
path = "src/lib.rs"

[[bin]]
name = "tiny-agent"
path = "src/main.rs"

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-markdown", "dep:unicode-width"]
# Expose the scripted `provider::mock` (otherwise cfg(test)-only) so binding
# crates and downstream users can run offline / dry-run loops without a key.
mock = []
# `run_code` tool: LLM-written JS executed in an in-process wasm sandbox
# (quickjs-ng compiled with ZERO wasi imports, driven by wasmtime). Off by
# default — it adds ≈4.6 MiB to the release binary (M2-measured on the musl
# static build; design §10) and is a per-deployment trust decision
# (docs/run_code_design.md §15, milestone M1).
# sha2: audit-input hashing in run_code's meta trace, truncated to 128 bits
# (design §8.4) — already in the tree transitively via wasmtime, so this is
# a feature-gated direct edge over an existing dep, not a new dependency.
code = ["dep:wasmtime", "dep:sha2"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ratatui = { version = "0.30", optional = true, features = ["scrolling-regions"] }
crossterm = { version = "0.29", optional = true }
tui-markdown = { version = "0.3", default-features = false, optional = true }
unicode-width = { version = "0.2", optional = true }
# Minimal wasmtime: Cranelift compiler + runtime, no async / wat / component
# model / pooling allocator. Synchronous like the rest of the crate.
# `cache` (v2 P1): on-disk compilation cache for quickjs.wasm — a fresh
# process no longer re-pays the lazy compile; any cache failure degrades to
# "no cache", never blocks the sandbox.
wasmtime = { version = "36.0.14", optional = true, default-features = false, features = ["cranelift", "runtime", "std", "cache"] }
# sha256 for run_code's audit meta (dual 128-bit-truncated input hashes).
sha2 = { version = "0.10", optional = true }

# Windows shell output decoding: cmd.exe (and many legacy programs) emit text in
# the system OEM code page (GBK/936 on Chinese Windows), not UTF-8. The shell
# tool decodes bytes itself, so it needs encoding_rs to interpret non-UTF-8
# output and windows-sys to read the active OEM code page. Unix tools are UTF-8,
# so these stay Windows-only and don't touch other platforms.
[target.'cfg(windows)'.dependencies]
encoding_rs = "0.8"
windows-sys = { version = "0.52", features = ["Win32_Globalization"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
