[package]
name = "tiny-agent"
version = "0.4.2"
edition = "2021"
# MSRV floor of the DEFAULT (headless) build: the heavy lifting stays in the
# kernel crate (crates/core — its icu_* chain needs 1.86); this crate's own
# default-tree deps sit below it (clap 4.6 = 1.85). Optional features need
# more and are enforced by their own deps' rust-version: `tui` → 1.88
# (ratatui 0.30). CI's msrv job pins the floor with a
# `cargo +1.86 check --locked` — the lockfile, not the resolver-of-the-day,
# is what users actually build.
rust-version = "1.86"
description = "A minimal single-binary AI agent: one JSON config, two modes (headless / TUI)"
license = "MIT"

# Workspace split (kernel extraction): the ROOT package is the CLI/binary
# half — process-level shell only (arg parsing, SIGINT, exit codes, headless
# rendering, batch orchestration, the optional TUI). The agent loop, tools,
# providers, config, skills, MCP, session, and compression live in
# crates/core (`tiny-agent-core`, lib name `tiny_agent`); the Python / Node
# bindings path-depend on that crate directly.
[workspace]
members = [".", "crates/core", "bindings/python", "bindings/node"]
resolver = "2"

[[bin]]
name = "tiny-agent"
path = "src/main.rs"

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-markdown", "dep:unicode-width"]
# Forwarding features: the binary's --version manifest, the release builds,
# and the e2e/musl CI jobs drive these at the workspace root exactly as they
# did when bin + lib shared one package — they just forward into the kernel.
# `code`: the run_code sandbox (see crates/core/Cargo.toml for the rationale
# and the ≈4.6 MiB / trust-decision notes).
code = ["tiny_agent/code"]
# `mock`: the scripted provider, for offline dry-runs of the binary itself.
mock = ["tiny_agent/mock"]

[dependencies]
tiny_agent = { package = "tiny-agent-core", path = "crates/core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# batch task fragments + report files are serde types; the blocking Client is
# threaded through batch signatures (built via tiny_agent::provider::new_client).
# Same versions/features as the kernel crate so the workspace lockfile stays
# single-sourced.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
ratatui = { version = "0.30", optional = true, features = ["scrolling-regions"] }
crossterm = { version = "0.29", optional = true }
tui-markdown = { version = "0.3", default-features = false, optional = true }
unicode-width = { version = "0.2", optional = true }

# SIGINT plumbing in signal.rs is #[cfg(unix)] (Windows uses
# SetConsoleCtrlHandler); keeping libc here off the Windows dependency graph.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Unit tests inside harness.rs drive the retry ladder with the scripted
# MockProvider — visible from THIS crate only when the dependency carries the
# `mock` feature (provider::mock is cfg(any(test, feature="mock")) in the
# kernel, and "test" there means the kernel's own cfg(test)). Declaring the
# dep again as a dev-dependency with the feature unifies mock ON for test
# builds only; plain `cargo build` stays mock-free.
[dev-dependencies]
tiny_agent = { package = "tiny-agent-core", path = "crates/core", features = ["mock"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
