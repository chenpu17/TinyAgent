name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    # rustfmt 门禁：全 workspace（根 crate + 双绑定）--check 模式，零改动。
    # 存量 305 处已在一个纯格式 commit 里清零（见 .git-blame-ignore-revs），
    # 此后任何漂移在 CI 红灯、本地 `cargo fmt --all` 修。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # run_code 三处同源契约（工具描述 / skill 正文 / 附录 A 指纹）：微调
      # 数据依赖的面，漂移必须红灯而不是靠手工 --check（2026-09 审核 #8）。
      # 交叉核对 README code 配置表与 CodeConfig::default（防单侧漂移）。
      - run: python3 scripts/sync_run_code_contract.py --check
      # README 代码结构树：行数从源文件实时生成，手工维护曾偏差 2–5× 并漏列
      # 整个模块（外审 P1）——生成物漂移红灯。
      - run: python3 scripts/gen_structure.py --check
      # E0′ 评测装置漂移门（M4）：变体技能指纹 vs 装配文档登记、A③ 边界句
      # 逐字一致、all-off 变体无门控内容渗漏——评测配方可复现性的 CI 面。
      - run: python3 scripts/check_eval_apparatus.py

  test:
    # 三平台 × 双 clippy 配置 + 测试。CLAUDE.md 约定两个 clippy 都要过：
    # TUI 代码在 #[cfg(feature = "tui")] 后，默认构建看不到它。
    # tests/lib_api.rs 门在 `mock` feature 上（provider::mock 是
    # cfg(any(test, feature="mock"))——integration test 编译时 lib 不带
    # cfg(test)），所以测试命令必须带 mock 才真正跑到它。
    # 拆分后命令显式圈 -p 内核+CLI 两个包：根目录裸命令只覆盖根 package
    # （现在是 CLI），feature 按 owner 分开——tui 只在 CLI 包，mock 的
    # lib_api 集成层在内核包，一条 --features 命令圈不住两包并集。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # 两个 clippy 都带 -D warnings：本地现状零警告，门禁就该硬。
      - run: cargo clippy -p tiny-agent-core -p tiny-agent --all-targets -- -D warnings
      - run: cargo clippy -p tiny-agent --features tui --all-targets -- -D warnings
      - run: cargo test -p tiny-agent-core -p tiny-agent
      - run: cargo test -p tiny-agent-core --features mock
      - run: cargo test -p tiny-agent --features tui,mock

  code:
    # `code` feature（run_code 沙箱）门禁：第三个 clippy 配置——run_code.rs
    # 与 agent.rs 的 set_code_* 在 #[cfg(feature="code")] 后，默认/tui 构建都
    # 看不到（与 tui 同款盲区，单跑前两个 clippy 会漏）。测试带 mock 同时
    # 跑到 lib_api 集成层。单独 job 而非并进 test 矩阵：wasmtime+cranelift
    # 依赖树大，3 平台全量构建不划算——沙箱平台中立（quickjs.wasm 资产嵌入、
    # 宿主纯 Rust），ubuntu 单平台钉住，对齐绑定层"先单平台"的先例。
    # 拆分后 code 是内核 feature，CLI 以转发 feature（code = ["tiny_agent/code"]）
    # 暴露给根目录构建——`-p` 两包同开 code 等价于拆分前的根命令；tui 只在
    # CLI 包，交叉配置单独圈。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p tiny-agent-core -p tiny-agent --features code --all-targets -- -D warnings
      # 第四个 clippy 配置：tui×code 交叉面（TUI 的 CodeLog 渲染、/code 命令、
      # set_code_* 交互）在任一单 feature 配置里都不可见（外审：CI 盲区）。
      - run: cargo clippy -p tiny-agent --features tui,code --all-targets -- -D warnings
      - run: cargo test -p tiny-agent-core -p tiny-agent --features code,mock

  e2e:
    # 场景化端到端门（离线、零密钥）：内置 SSE 场景 mock + 真实 CLI/HTTP
    # 栈，覆盖打转护栏（stuck_loop 硬停 / 进展不误停 / nudge 只进历史不进
    # 事件流）、单轮 10 路并行 task fan-out（8/波上限 + N:N 配平 +
    # 请求数精确核算）、SIGINT 优雅取消（exit 130）。脚本化 MockProvider
    # 单测覆盖进程内 loop 不变量，这个 job 守它们到不了的「真栈」层
    # （CLI 解析、SSE 解码、进程信号）。单平台：场景无平台差异。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --features code
      - run: python3 scripts/e2e_scenarios.py

  python-binding:
    # 2026-10 起扩到 Windows：手动跑绿一轮（CPython 3.12 win_amd64，
    # maturin develop：39 passed / 4 skipped；--features code：42 passed /
    # 1 skipped——code 自适应测试全激活）满足了此前"等手动 Windows 绿
    # 再扩矩阵"的前置条件。venv 接线用显式路径探测而非 activate（POSIX
    # 与 Windows 的 bin/Scripts 二选一），shell 固定 bash（两平台 runner
    # 都自带）。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # maturin develop 需要 virtualenv；conftest.py 从 __file__ 反解仓库根，
      # 以 sys.executable 起 examples/mock_openai.py，离线自洽。venv 用显式
      # 路径接管（VIRTUAL_ENV + PATH），跨平台的 bin/ 与 Scripts/ 二选一。
      - shell: bash
        run: |
          python -m venv .venv
          VENV="$PWD/.venv"
          if [ -x "$VENV/Scripts/python.exe" ]; then BIN="$VENV/Scripts"; else BIN="$VENV/bin"; fi
          export VIRTUAL_ENV="$VENV"
          export PATH="$BIN:$PATH"
          "$BIN/python" -m pip install maturin pytest
          cd bindings/python
          maturin develop
          "$BIN/python" -m pytest tests/ -q
      - run: cargo clippy -p tiny-agent-py --all-targets -- -D warnings
      # The `code` forwarding feature (run_code switch methods) must stay
      # compiling; the behavioral tests for it run against a --features code
      # build locally — the compile gate is the cheap CI equivalent.
      - run: cargo clippy -p tiny-agent-py --features code --all-targets -- -D warnings
      # ...and the BEHAVIORAL tests too (enable_code flips the tool table,
      # set_code_config rejects unknown keys): the clippy gate can't see a
      # feature that compiles but no-ops. Second wheel in the same venv;
      # tests are build-adaptive, so this round runs the code suite.
      - shell: bash
        run: |
          VENV="$PWD/.venv"
          if [ -x "$VENV/Scripts/python.exe" ]; then BIN="$VENV/Scripts"; else BIN="$VENV/bin"; fi
          export VIRTUAL_ENV="$VENV"
          export PATH="$BIN:$PATH"
          cd bindings/python
          maturin develop --features code
          "$BIN/python" -m pytest tests/ -q

  node-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          cd bindings/node
          npm ci
          npm run build:debug
          npm test
      - run: cargo clippy -p tiny-agent-node --all-targets -- -D warnings
      # `code` forwarding feature compile gate (same rationale as the python job).
      - run: cargo clippy -p tiny-agent-node --features code --all-targets -- -D warnings
      # Behavioral round for the same feature (see python job): rebuild the
      # .node with --features code so the build-adaptive code tests run.
      - run: |
          cd bindings/node
          npm run build:debug -- --features code
          npm test

  musl:
    # 移植性冒烟：musl 静态构建是"嵌入式低配 Linux"定位的核心交付物，
    # 每次 push 确认它编得过。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      # 二进制级冒烟：--version --json 是为 CI 断言设计的机器可读面（README
      # 构建节）。此前 CI 只 build 从不 exec——「编得过但跑不起来」的静态产物
      # 正是每次 tag 发出去的东西（外审）。白构建 features 必须为空。
      - run: |
          BIN=./target/x86_64-unknown-linux-musl/release/tiny-agent
          "$BIN" --version --json | python3 -c '
          import json, sys
          v = json.load(sys.stdin)
          assert not v["features"], f"plain build carries features: {v}"
          print("plain build features:", v["features"])
          '
      # code 变体冒烟：wasmtime+cranelift 纯 Rust 静态链接（quickjs.wasm 资产
      # 已嵌入、构建不碰 C 工具链，设计 D1）——"嵌入式低配 Linux + 沙箱"是
      # 核心交付组合，随每次 push 确认它仍编得出静态 ELF。
      - run: cargo build --release --target x86_64-unknown-linux-musl --features code
      # code 变体的 features 必须恰为 ["code"]（无 tui——musl 产物定位无头）。
      - run: |
          BIN=./target/x86_64-unknown-linux-musl/release/tiny-agent
          "$BIN" --version --json | python3 -c '
          import json, sys
          v = json.load(sys.stdin)
          assert v["features"] == ["code"], f"code build features wrong: {v}"
          print("code build features:", v["features"])
          '

  msrv:
    # rust-version 门禁（Cargo.toml 的 1.86）：默认（headless）构建在钉住的
    # MSRV 工具链上必须 check 通过——此前全 job 跟 stable 漂，新 stable 收紧
    # lint 时无代码改动的提交也会突然红灯，用户也无从知道自己机器够不够。
    # 地板由锁文件决定（icu_* 2.2.0 = 1.86，见 Cargo.toml 注释），故带
    # --locked：校验的是用户实际拿到的依赖组合，而不是解析器当天挑的版本。
    # 只 check 默认 feature：tui/code 的更高地板（1.88/1.86）由 ratatui /
    # wasmtime 自身的 rust-version 强制，cargo 会给明确报错。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  audit:
    # cargo-audit：RustSec 公告库扫描依赖树。依赖面小（reqwest + serde +
    # ratatui 级别），每次推送全量扫；出现 advisory 时红灯，由维护者决策
    # 升级或加 ignore。工具链锁定 stable，advisory 库每日随上游更新。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
