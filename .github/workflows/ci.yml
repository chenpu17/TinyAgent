name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    # rustfmt 门禁：全 workspace（根 crate + 双绑定）--check 模式，零改动。
    # 存量 305 处已在一个纯格式 commit 里清零（见 .git-blame-ignore-revs），
    # 此后任何漂移在 CI 红灯、本地 `cargo fmt --all` 修。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # run_code 三处同源契约（工具描述 / skill 正文 / 附录 A 指纹）：微调
      # 数据依赖的面，漂移必须红灯而不是靠手工 --check（2026-09 审核 #8）。
      - run: python3 scripts/sync_run_code_contract.py --check

  test:
    # 三平台 × 双 clippy 配置 + 测试。CLAUDE.md 约定两个 clippy 都要过：
    # TUI 代码在 #[cfg(feature = "tui")] 后，默认构建看不到它。
    # tests/lib_api.rs 门在 `mock` feature 上（provider::mock 是
    # cfg(any(test, feature="mock"))——integration test 编译时 lib 不带
    # cfg(test)），所以测试命令必须带 mock 才真正跑到它。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # 两个 clippy 都带 -D warnings：本地现状零警告，门禁就该硬。
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --features tui --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --features tui,mock

  code:
    # `code` feature（run_code 沙箱）门禁：第三个 clippy 配置——run_code.rs
    # 与 agent.rs 的 set_code_* 在 #[cfg(feature="code")] 后，默认/tui 构建都
    # 看不到（与 tui 同款盲区，单跑前两个 clippy 会漏）。测试带 mock 同时
    # 跑到 lib_api 集成层。单独 job 而非并进 test 矩阵：wasmtime+cranelift
    # 依赖树大，3 平台全量构建不划算——沙箱平台中立（quickjs.wasm 资产嵌入、
    # 宿主纯 Rust），ubuntu 单平台钉住，对齐绑定层"先单平台"的先例。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --features code --all-targets -- -D warnings
      - run: cargo test --features code,mock

  python-binding:
    # 绑定测试只在 ubuntu 跑：绑定层从未在 Windows 验证过（三次 Windows
    # 修复全是核心代码），先不做 continue-on-error 的虚假信心，等手动
    # 在 Windows 跑绿一轮再扩矩阵。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # maturin develop 需要 virtualenv；conftest.py 从 __file__ 反解仓库根，
      # 以 sys.executable 起 examples/mock_openai.py，离线自洽。
      - run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest
          cd bindings/python
          maturin develop
          python -m pytest tests/ -q
      - run: cargo clippy -p tiny-agent-py --all-targets -- -D warnings
      # The `code` forwarding feature (run_code switch methods) must stay
      # compiling; the behavioral tests for it run against a --features code
      # build locally — the compile gate is the cheap CI equivalent.
      - run: cargo clippy -p tiny-agent-py --features code --all-targets -- -D warnings

  node-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          cd bindings/node
          npm ci
          npm run build:debug
          npm test
      - run: cargo clippy -p tiny-agent-node --all-targets -- -D warnings
      # `code` forwarding feature compile gate (same rationale as the python job).
      - run: cargo clippy -p tiny-agent-node --features code --all-targets -- -D warnings

  musl:
    # 移植性冒烟：musl 静态构建是"嵌入式低配 Linux"定位的核心交付物，
    # 每次 push 确认它编得过。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      # code 变体冒烟：wasmtime+cranelift 纯 Rust 静态链接（quickjs.wasm 资产
      # 已嵌入、构建不碰 C 工具链，设计 D1）——"嵌入式低配 Linux + 沙箱"是
      # 核心交付组合，随每次 push 确认它仍编得出静态 ELF。
      - run: cargo build --release --target x86_64-unknown-linux-musl --features code

  audit:
    # cargo-audit：RustSec 公告库扫描依赖树。依赖面小（reqwest + serde +
    # ratatui 级别），每次推送全量扫；出现 advisory 时红灯，由维护者决策
    # 升级或加 ignore。工具链锁定 stable，advisory 库每日随上游更新。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
