# Release：tag 触发，musl 静态产物上传 GitHub Releases。
# 与 ci.yml 分开（ci 跑 push/PR，release 只跑 tag），避免重复构建。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # 产物带 code feature（run_code 沙箱编译入内、运行期 enabled 默认关，
      # 用户 config "code":{"enabled":true} 才暴露给模型）——产品拍板 2026-09：
      # A/B 指标已验证（PRD §10 两批），+4.6 MiB 换开箱可用；默认关维持
      # "被注入模型默认不获得循环+代码执行能力"的红线（设计 D15）。
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl --features code

      # 扩展点：后续版本可加 aarch64-musl / macOS / Windows 产物，
      # 每平台一个 job、同样的打包命名约定。
      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="tiny-agent-${VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "dist/${DIR}"
          cp "target/x86_64-unknown-linux-musl/release/tiny-agent" "dist/${DIR}/"
          cp README.md LICENSE "dist/${DIR}/"
          tar -czf "dist/${DIR}.tar.gz" -C dist "${DIR}"
          (cd dist && shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256")

      # 输入名是 generate_release_notes（v0.4.3 前 CI 警告 Unexpected input
      # 'generate_notes' 被静默忽略，自动 notes 一直没生效——改名才真开）。
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

  # Node 绑定跨平台分发（0.3.x）：主包 npm 包只带 loader/类型，*.node 按
  # optionalDependencies 拆平台子包（tiny-agent-<platform>）。每个平台 job
  # 构建 + npm pack 子包；publish job 在配了 NPM_TOKEN secret 时发布到
  # registry，否则把子包 tarball 附到 GitHub Release（npm install <tgz> 可用）。
  bindings-node:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  target: x86_64-apple-darwin,       pkg: tiny-agent-darwin-x64 }
          - { os: macos-latest,  target: aarch64-apple-darwin,      pkg: tiny-agent-darwin-arm64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,  pkg: tiny-agent-linux-x64-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, pkg: tiny-agent-linux-x64-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   pkg: tiny-agent-win32-x64-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: node-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build native binding
        working-directory: bindings/node
        run: npm install && npm run build -- --target ${{ matrix.target }}

      # 子包 = package.json（name/version 与主包一致）+ 平台 .node + LICENSE。
      # 版本单源 = 主包 package.json；子包 name 必须与生成的 index.js 的
      # require('tiny-agent-<platform>') 候选一致（打包验收测试钉住）。
      - name: Stage and pack subpackage
        shell: bash
        working-directory: bindings/node
        env:
          PKG_NAME: ${{ matrix.pkg }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          STAGE="npm-stage/${PKG_NAME}"
          mkdir -p "$STAGE"
          NODE_FILE=$(ls tiny-agent.*.node | head -1)
          cp "$NODE_FILE" "$STAGE/"
          cp ../../LICENSE "$STAGE/"
          PKG_STAGE="$STAGE" PKG_VERSION="$VERSION" PKG_NODE_FILE="$NODE_FILE" \
            node -e 'const fs=require("fs");const e=process.env;fs.writeFileSync(e.PKG_STAGE+"/package.json",JSON.stringify({name:e.PKG_NAME,version:e.PKG_VERSION,description:`TinyAgent native binding (${e.PKG_NAME})`,license:"MIT",main:e.PKG_NODE_FILE,files:[e.PKG_NODE_FILE]},null,2)+"\n")'
          (cd "$STAGE" && npm pack --silent)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: bindings/node/npm-stage/**/*.tgz

  # Python 绑定（0.4.x）：sdist + wheel（CPython manylinux2014 /
  # manylinux_2_17 x86_64）附 GitHub
  # Release，不发布 PyPI（产品决策未定）。不带 code feature——标准 wheel 不携带
  # wasmtime（~10MB）是既定口径（bindings/python/Cargo.toml 注释 / 设计 §8.6 D9 /
  # README run_code 节），与 musl 二进制"产物带 code"是两条不同产物线；未编入时
  # enable_code 等三方法返回带重建提示的明确错误。wheel 是 CPython 单版本 ABI
  # （pyo3 未开 abi3），其他解释器走 sdist 自行构建。
  bindings-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: python

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # wheel 走 manylinux2014 容器：宿主机直接构建只能按宿主 glibc 打
      # `linux_x86_64` 标签，`--compatibility manylinux2014` 又会因子过新被
      # auditwheel 拒绝；容器内构建 + 修复才能得到可移植的 manylinux_2_17。
      # 版本号单源 = pyproject.toml（5 处同步约定），maturin 自动写入
      # wheel/sdist 文件名，不从 tag 解析、不硬编码。
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: build
          # --find-interpreter 会捡到容器里的 Python 3.14，而 pyo3 0.22 上限 3.13
          # （本地 3.14 实测复现：configured interpreter newer than maximum supported）；
          # 且 pypa 镜像已随 EOL 移除 cp38（-i 3.8 上轮真跑失败的原因）。显式钉
          # 3.9–3.13（镜像现行集合，见 pypa/manylinux Dockerfile）；3.8 用户走
          # sdist 自建；升级 pyo3 后可放宽或换回 --find-interpreter。
          args: --release --out dist -i 3.9 -i 3.10 -i 3.11 -i 3.12 -i 3.13
          manylinux: manylinux2014

      # docker 容器以 root 身份往挂载的工作树写 wheel：dist/ 归 root，宿主
      # runner 用户随后往同一 dist/ 写 sdist 会 EACCES——v0.4.3 三连失败的
      # 根因（jobs API 实锤：step6 wheel 成功、step7 sdist exit 1）。构建后
      # 先把归属还给 runner，再跑宿主侧步骤。
      - name: Fix dist ownership (container writes as root)
        run: sudo chown -R "$(id -u):$(id -g)" bindings/python/dist

      # sdist 与解释器/ABI 无关，宿主直接打（内含 crates/core 路径依赖，
      # 使用者在目标平台自行编译）。
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          files: |
            bindings/python/dist/*

  bindings-node-publish:
    needs: bindings-node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: pkgs

      - name: Publish to npm (requires NPM_TOKEN secret)
        if: env.NPM_TOKEN != ''
        run: |
          find pkgs -name '*.tgz' | while read -r tgz; do
            npm publish "$tgz" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 未配 NPM_TOKEN：把子包 tarball 附到 GitHub Release（离线分发路径，
      # npm install <tgz> 可用）；配了 token 的发布此步多余但无害。
      - uses: softprops/action-gh-release@v3
        if: env.NPM_TOKEN == ''
        with:
          generate_release_notes: false
          files: |
            pkgs/**/*.tgz
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
