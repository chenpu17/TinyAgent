# Release：tag 触发，musl 静态产物上传 GitHub Releases。
# 与 ci.yml 分开（ci 跑 push/PR，release 只跑 tag），避免重复构建。
name: release

on:
  push:
    tags: ['v*']

# workflow 级只读；写 Release 的三个 job（musl / bindings-python /
# bindings-node-publish）各自带 job 级 contents: write，bindings-node
# 矩阵只传 artifact、继承只读。
permissions:
  contents: read

# 同 tag 重复触发的串行化（cancel-in-progress: false——发版中途不许互相
# 取消）。Release 创建竞态本身 action-gh-release v3 已自愈（422
# already_exists 重试、draft 优先、重复 draft 清理）；run 内三个 job 对
# 同一 Release 的并发写由 action 自身处理，无需在这里排队。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# action 固定到 commit SHA（`@<SHA> # vN`，Dependabot 周更），含
# dtolnay/rust-toolchain（钉 SHA + toolchain: stable 输入，工具链语义不变、
# action 代码由 SHA 锚定——与 ci.yml 同批处理）。

jobs:
  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # 发布纪律（外审 D-F4）：发布产物必须按审计过的锁文件组合构建——锁欠
      # 更新的提交在这里红灯，而不是静默重解析出与审计不同的依赖树。三个
      # 构建 job（musl / node / python）同款。
      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      # 产物带 code feature（run_code 沙箱编译入内、运行期 enabled 默认关，
      # 用户 config "code":{"enabled":true} 才暴露给模型）——产品拍板 2026-09：
      # A/B 指标已验证（PRD §10 两批），+4.6 MiB 换开箱可用；默认关维持
      # "被注入模型默认不获得循环+代码执行能力"的红线（设计 D15）。
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl --features code --locked

      # 扩展点：后续版本可加 aarch64-musl / macOS / Windows 产物，
      # 每平台一个 job、同样的打包命名约定。
      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="tiny-agent-${VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "dist/${DIR}"
          cp "target/x86_64-unknown-linux-musl/release/tiny-agent" "dist/${DIR}/"
          cp README.md LICENSE "dist/${DIR}/"
          tar -czf "dist/${DIR}.tar.gz" -C dist "${DIR}"
          (cd dist && shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256")

      # 输入名是 generate_release_notes（v0.4.3 前 CI 警告 Unexpected input
      # 'generate_notes' 被静默忽略，自动 notes 一直没生效——改名才真开）。
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

  # Node 绑定跨平台分发（0.3.x）：主包 npm 包只带 loader/类型，*.node 按
  # optionalDependencies 拆平台子包（tiny-agent-<platform>）。每个平台 job
  # 构建 + npm pack 子包；publish job 在配了 NPM_TOKEN secret 时发布到
  # registry，否则把子包 tarball 附到 GitHub Release（npm install <tgz> 可用）。
  bindings-node:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  target: x86_64-apple-darwin,       pkg: tiny-agent-darwin-x64 }
          - { os: macos-latest,  target: aarch64-apple-darwin,      pkg: tiny-agent-darwin-arm64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,  pkg: tiny-agent-linux-x64-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, pkg: tiny-agent-linux-x64-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   pkg: tiny-agent-win32-x64-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: node-${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      # FFI 兜底覆盖（外审 D-F5）：workspace [profile.release] panic="abort"
      # 会让 napi 的 catch_unwind → Promise reject 在发布产物里全部失效
      # （核心 panic 直接杀死宿主进程）——env 覆盖回 unwind，CLI 二进制
      # 的 musl job 保持 abort 不变（那是刻意的体积/语义取舍）。
      - name: Build native binding
        working-directory: bindings/node
        env:
          CARGO_PROFILE_RELEASE_PANIC: unwind
        run: npm install && npm run build -- --target ${{ matrix.target }}

      # 子包 = package.json（name/version 与主包一致）+ 平台 .node + LICENSE。
      # 版本单源 = 主包 package.json；子包 name 必须与生成的 index.js 的
      # require('tiny-agent-<platform>') 候选一致（打包验收测试钉住）。
      - name: Stage and pack subpackage
        shell: bash
        working-directory: bindings/node
        env:
          PKG_NAME: ${{ matrix.pkg }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          STAGE="npm-stage/${PKG_NAME}"
          mkdir -p "$STAGE"
          NODE_FILE=$(ls tiny-agent.*.node 2>/dev/null | head -1)
          # 显式存在性断言（外审 D-F3）：GitHub 默认 bash -e 无 pipefail，
          # `.node` 缺失时 ls 的失败被 head 的 0 掩盖，错误会延迟到 cp 才以
          # 误导性的形态浮出——这里当面失败并说明根因。
          if [ -z "$NODE_FILE" ]; then
            echo "ERROR: no tiny-agent.*.node produced by the napi build" >&2
            exit 1
          fi
          cp "$NODE_FILE" "$STAGE/"
          cp ../../LICENSE "$STAGE/"
          PKG_STAGE="$STAGE" PKG_VERSION="$VERSION" PKG_NODE_FILE="$NODE_FILE" \
            node -e 'const fs=require("fs");const e=process.env;fs.writeFileSync(e.PKG_STAGE+"/package.json",JSON.stringify({name:e.PKG_NAME,version:e.PKG_VERSION,description:`TinyAgent native binding (${e.PKG_NAME})`,license:"MIT",main:e.PKG_NODE_FILE,files:[e.PKG_NODE_FILE]},null,2)+"\n")'
          (cd "$STAGE" && npm pack --silent)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.pkg }}
          path: bindings/node/npm-stage/**/*.tgz

  # Python 绑定（0.4.x）：sdist + wheel（CPython manylinux2014 /
  # manylinux_2_17 x86_64）附 GitHub
  # Release，不发布 PyPI（产品决策未定）。不带 code feature——标准 wheel 不携带
  # wasmtime（~10MB）是既定口径（bindings/python/Cargo.toml 注释 / 设计 §8.6 D9 /
  # README run_code 节），与 musl 二进制"产物带 code"是两条不同产物线；未编入时
  # enable_code 等三方法返回带重建提示的明确错误。wheel 是 CPython 单版本 ABI
  # （pyo3 未开 abi3），其他解释器走 sdist 自行构建。
  bindings-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: python

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # wheel 走 manylinux2014 容器：宿主机直接构建只能按宿主 glibc 打
      # `linux_x86_64` 标签，`--compatibility manylinux2014` 又会因子过新被
      # auditwheel 拒绝；容器内构建 + 修复才能得到可移植的 manylinux_2_17。
      # 版本号单源 = pyproject.toml（5 处同步约定），maturin 自动写入
      # wheel/sdist 文件名，不从 tag 解析、不硬编码。
      # wheel 面的 FFI 兜底与 node 侧同款（外审 D-F5）：env 覆盖 workspace
      # panic="abort"（PyO3 的 PanicException 只在 unwind 下存在），发布
      # wheel 的核心 panic 转为 Python 异常而非进程死亡。
      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          CARGO_PROFILE_RELEASE_PANIC: unwind
        with:
          working-directory: bindings/python
          command: build
          # --find-interpreter 会捡到容器里的 Python 3.14，而 pyo3 0.22 上限 3.13
          # （本地 3.14 实测复现：configured interpreter newer than maximum supported）；
          # 且 pypa 镜像已随 EOL 移除 cp38（-i 3.8 上轮真跑失败的原因）。显式钉
          # 3.9–3.13（镜像现行集合，见 pypa/manylinux Dockerfile）；3.8 用户走
          # sdist 自建；升级 pyo3 后可放宽或换回 --find-interpreter。
          args: --release --out dist -i 3.9 -i 3.10 -i 3.11 -i 3.12 -i 3.13
          manylinux: manylinux2014

      # docker 容器以 root 身份往挂载的工作树写 wheel：dist/ 归 root，宿主
      # runner 用户随后往同一 dist/ 写 sdist 会 EACCES——v0.4.3 三连失败的
      # 根因（jobs API 实锤：step6 wheel 成功、step7 sdist exit 1）。构建后
      # 先把归属还给 runner，再跑宿主侧步骤。
      - name: Fix dist ownership (container writes as root)
        run: sudo chown -R "$(id -u):$(id -g)" bindings/python/dist

      # sdist 与解释器/ABI 无关，宿主直接打（内含 crates/core 路径依赖，
      # 使用者在目标平台自行编译）。
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: false
          files: |
            bindings/python/dist/*

  bindings-node-publish:
    needs: bindings-node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 附 Release 的回退路径（未配 NPM_TOKEN 时活跃）也要写权限；publish 路径
    # 同样需要（gh-release 不跑，但 job 权限是统一的）。
    permissions:
      contents: write
    # NPM_TOKEN 放 job 级 env：job 级 env 允许映射 secrets，且在任何语义下
    # 都对 step 的 `if:` 可见——两个 step 的条件写法因此保持不动。
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pkgs

      # 幂等发布：从 tgz 里读出 name@version，registry 已存在就 notice 跳过
      # （同 tag 重跑 / concurrency 排队后的二次触发不再 403 翻车）。
      - name: Publish to npm (requires NPM_TOKEN secret)
        if: env.NPM_TOKEN != ''
        run: |
          find pkgs -name '*.tgz' | while read -r tgz; do
            name=$(tar -xzOf "$tgz" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);console.log(p.name+"@"+p.version)})')
            if npm view "$name" version >/dev/null 2>&1; then
              echo "::notice::$name already on the registry, skipping"
            else
              npm publish "$tgz" --access public
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 未配 NPM_TOKEN：把子包 tarball 附到 GitHub Release（离线分发路径，
      # npm install <tgz> 可用）；配了 token 时子包走上一步发 npm，此步跳过。
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: env.NPM_TOKEN == ''
        with:
          generate_release_notes: false
          files: |
            pkgs/**/*.tgz
