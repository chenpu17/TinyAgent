# 真实接线冒烟（每周 / 手动触发，独立于 ci.yml——不随 push 跑）：
# 两处 #[ignore] 的本地 stdio MCP echo 端到端——examples/mcp_echo.py 零依赖
# （runner 自带 python3）、不碰网络，所以能进定时 job。此前它们零 CI 覆盖，
# 而覆盖的恰是 MCP 真实连接与 sandbox↔MCP 接线（外审）。
# tools/mcp.rs 的 filesystem_mcp 需要 npx+网络，保持手动：
#   cargo test filesystem_mcp -- --ignored --nocapture
# run_code.rs 的 fuel_rate_calibration 是校准测量不是断言，不进任何 job。
name: live
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

# 最低权限基线：只读代码。
permissions:
  contents: read

# action 全量钉 SHA（round-3 评审 R3-03：ci.yml 已宣布 dtolnay@stable 豁免
# 理由被外审否决——工具链漂移与 action 代码供应链漂移是两回事，此处的豁免
# 注释是残留；同款钉 SHA + toolchain: stable 输入）。
# R3-02：cargo test 对名字过滤零匹配 exit 0——周活 job 的唯一使命就是跑那
# 两个 #[ignore] 测试，任一被改名/移走时必须显式红而不是静默空转。每个
# cargo 步骤先跑 --list 断言过滤器恰好命中 1 个测试，再跑本体；两条 cargo
# 命令带 --locked（与 ci.yml 口径一致）。
jobs:
  mcp-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: gate mock live test exists (zero-match would exit 0)
        run: |
          n=$(cargo test --locked -p tiny-agent-core --features mock --lib hot_add_remove_mcp_server_live -- --list | grep -c ': test')
          echo "matched $n test(s)"
          test "$n" -eq 1
      - run: cargo test --locked -p tiny-agent-core --features mock --lib hot_add_remove_mcp_server_live -- --ignored --nocapture
      - name: gate code,mock live test exists (zero-match would exit 0)
        run: |
          n=$(cargo test --locked -p tiny-agent-core --features code,mock --lib guest_reaches_mcp_tools_live -- --list | grep -c ': test')
          echo "matched $n test(s)"
          test "$n" -eq 1
      - run: cargo test --locked -p tiny-agent-core --features code,mock --lib guest_reaches_mcp_tools_live -- --ignored --nocapture
