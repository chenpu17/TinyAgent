# 真实接线冒烟（每周 / 手动触发，独立于 ci.yml——不随 push 跑）：
# 两处 #[ignore] 的本地 stdio MCP echo 端到端——examples/mcp_echo.py 零依赖
# （runner 自带 python3）、不碰网络，所以能进定时 job。此前它们零 CI 覆盖，
# 而覆盖的恰是 MCP 真实连接与 sandbox↔MCP 接线（外审）。
# tools/mcp.rs 的 filesystem_mcp 需要 npx+网络，保持手动：
#   cargo test filesystem_mcp -- --ignored --nocapture
# run_code.rs 的 fuel_rate_calibration 是校准测量不是断言，不进任何 job。
name: live
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

# 最低权限基线：只读代码。
permissions:
  contents: read

# action 固定到 commit SHA（同 ci.yml 的口径）；dtolnay/rust-toolchain@stable
# 豁免——该 ref 本就是刻意跟随 stable 分支的浮动 tag。
jobs:
  mcp-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p tiny-agent-core --features mock --lib hot_add_remove_mcp_server_live -- --ignored --nocapture
      - run: cargo test -p tiny-agent-core --features code,mock --lib guest_reaches_mcp_tools_live -- --ignored --nocapture
