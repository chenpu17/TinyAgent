# 真实接线冒烟（每周 / 手动触发，独立于 ci.yml——不随 push 跑）：
# 两处 #[ignore] 的本地 stdio MCP echo 端到端——examples/mcp_echo.py 零依赖
# （runner 自带 python3）、不碰网络，所以能进定时 job。此前它们零 CI 覆盖，
# 而覆盖的恰是 MCP 真实连接与 sandbox↔MCP 接线（外审）。
# tools/mcp.rs 的 filesystem_mcp 需要 npx+网络，保持手动：
#   cargo test filesystem_mcp -- --ignored --nocapture
# run_code.rs 的 fuel_rate_calibration 是校准测量不是断言，不进任何 job。
name: live
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
jobs:
  mcp-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features mock --lib hot_add_remove_mcp_server_live -- --ignored --nocapture
      - run: cargo test --features code,mock --lib guest_reaches_mcp_tools_live -- --ignored --nocapture
